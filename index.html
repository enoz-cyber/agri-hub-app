<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri Hub - Guide View</title>
    <style>
        /* Base Page Styles */
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .category-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .guide-card {
            background: #1e293b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guide-card:hover {
            border-color: #f59e0b;
        }

        /* --- FIXED MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* Hidden by default */
            display: none; 
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a2230;
            color: #ffffff;
            padding: 28px 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            position: relative;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            border: 1px solid #334155;
        }

        .modal-close-x {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }
        .modal-close-x:hover {
            color: #ffffff;
        }

        .modal-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 20px;
            color: #f8fafc;
        }

        .modal-content p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-unlock-btn {
            background: #f59e0b;
            color: #111827;
            font-weight: bold;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        .modal-unlock-btn:hover {
            background: #d97706;
        }

        .modal-close-text {
            background: transparent;
            border: none;
            color: #94a3b8;
            margin-top: 16px;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-close-text:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="category-header">Precision Agriculture Categories</div>
        
        <!-- Example clickable guide that triggers the modal -->
        <div class="guide-card" onclick="openModal()">
            <span>Disc Harrow Alignment Guide (Locked)</span>
            <span>🔒</span>
        </div>
    </div>

    <!-- Paywall Modal Overlay -->
    <div id="paywall-modal" class="modal-overlay">
        <div class="modal-content" id="modal-card">
            <!-- Top-Right X Close Button -->
            <button class="modal-close-x" id="modal-close-x-btn" aria-label="Close modal">&times;</button>
            
            <!-- Modal Body Content -->
            <div class="modal-icon">🔒</div>
            <h2>Protected Premium Guide</h2>
            <p>Full step-by-step procedures and high-res infographics are securely locked against free viewing and screen grabs.</p>
            
            <button class="modal-unlock-btn" onclick="handleTransaction()">Unlock & Download Package (R20.00)</button>
            
            <!-- Bottom Close Text Button -->
            <button class="modal-close-text" id="modal-close-text-btn">Close</button>
        </div>
    </div>

    <script>
        const modalOverlay = document.getElementById('paywall-modal');
        const modalCard = document.getElementById('modal-card');
        const closeXBtn = document.getElementById('modal-close-x-btn');
        const closeTextBtn = document.getElementById('modal-close-text-btn');

        // Open modal function
        function openModal() {
            modalOverlay.classList.add('active');
        }

        // Close modal function (Purely toggles visibility, never touches browser history)
        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // 1. Close via top 'X' button
        closeXBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();
        });

        // 2. Close via bottom 'Close' text button
        closeTextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();
        });

        // 3. Close when clicking the dark backdrop outside the card
        modalOverlay.addEventListener('click', () => {
            closeModal();
        });

        // Prevent clicks inside the content card from accidentally bubbling up to close it
        modalCard.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // 4. Close when pressing the 'Escape' key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Placeholder for transaction action
        function handleTransaction() {
            alert('Redirecting to secure payment checkout...');
        }
    </script>
</body>
</html>
